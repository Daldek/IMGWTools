[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "imgwtools"
version = "2.2.0"
description = "Python library for accessing IMGW (Polish Institute of Meteorology and Water Management) public data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Piotr de Bever", email = "git@debever.pl" }
]
keywords = ["imgw", "hydrology", "meteorology", "poland", "weather", "data", "precipitation", "pmaxtp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

# Core dependencies - minimal for library usage
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# REST API server
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.24",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
]

# Command-line interface
cli = [
    "typer>=0.9",
    "rich>=13.0",
    "pydantic-settings>=2.0",
]

# SQLite database cache for hydro data
db = [
    "pydantic-settings>=2.0",
]

# DataFrame export (PMaXTPData.to_dataframe, imgw list)
pandas = [
    "pandas>=2.0",
]

# Full installation with all features
full = [
    "imgwtools[api,cli,db,pandas]",
]

# Development dependencies
dev = [
    "imgwtools[full]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "respx>=0.20",
]

[project.scripts]
imgw = "imgwtools.cli.main:app"

[project.urls]
Homepage = "https://github.com/Daldek/IMGWTools"
Repository = "https://github.com/Daldek/IMGWTools"
Issues = "https://github.com/Daldek/IMGWTools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/imgwtools"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "D",      # pydocstyle (numpy convention)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in argument defaults (common in FastAPI)
    "B904",   # raise ... from err (not always needed for HTTP exceptions)
    "D401",   # imperative mood (Polish CLI/web docstrings are descriptive)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["imgwtools"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
