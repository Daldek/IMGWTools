# Live tests (DEV-10.3, marker `live`), template from Nogat standards/ci/live.yml.
# Copy to .github/workflows/live.yml in projects that talk to external
# services (GUGiK, ČÚZK, IMGW-PIB, ČHMÚ, ...). Runs weekly and on demand, not
# on every push: external servers are slow, rate-limited and sometimes down.
name: Live

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Live tests
        # -m live replaces the default `-m 'not live'` of the pytest settings.
        run: uv run --no-sync pytest tests -m live -q
