# CI (DEV-7.7), template from Nogat standards/ci/ci.yml.
# Copy to .github/workflows/ci.yml. Runs scripts/gate.sh on Linux, macOS and
# Windows, on Python 3.12 (required) and the newest stable Python (reported,
# not blocking: wheels of geospatial dependencies often lag), and audits the
# locked PyPI dependencies (DEV-13.6; informative, not a required check).
# Commit messages are checked once, on pull requests into develop and from
# hotfix/* into main (DEV-4.5).
# Actions are pinned by commit SHA; Dependabot updates them
# (.github/dependabot.yml).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 5 * * 1"   # weekly audit against new advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'schedule'
    name: gate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        experimental: [false]
        include:
          - {os: ubuntu-latest, python: "3.15", experimental: true}
          - {os: macos-latest, python: "3.15", experimental: true}
          - {os: windows-latest, python: "3.15", experimental: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # the commit step needs history
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Gate
        shell: bash
        env:
          # Commits are checked once, when they enter develop or, for a hotfix,
          # main (DEV-4.5); everything else skips the commit step.
          GATE_COMMIT_RANGE: >-
            ${{ github.event_name != 'pull_request' && 'none'
                || github.base_ref == 'develop' && 'origin/develop..HEAD'
                || (github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/'))
                   && 'origin/main..HEAD'
                || 'none' }}
          # The author check applies to those pull requests from this
          # repository's own branches, not to forks or Dependabot, whose
          # commits keep their identity (DEV-16.5).
          GATE_CHECK_AUTHOR: >-
            ${{ (github.event_name == 'pull_request'
                 && (github.base_ref == 'develop'
                     || (github.base_ref == 'main' && startsWith(github.head_ref, 'hotfix/')))
                 && github.event.pull_request.head.repo.full_name == github.repository
                 && github.event.pull_request.user.login != 'dependabot[bot]') && '1' || '0' }}
        run: bash scripts/gate.sh

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
      - name: pip-audit
        # PyPI packages only: the ecosystem's own distributions come from git
        # tags until they are on PyPI and carry no hashes. Accepted findings:
        # add `--ignore-vuln <ID>` with a comment giving the reason (DEV-13.6).
        run: |
          skip=()
          for p in kartograf imgwtools hydrolog retman archiwista hydraulik hydrograf; do
            skip+=(--no-emit-package "$p" --no-emit-package "nogat-$p")
          done
          uv export --locked --all-extras --no-emit-project --format requirements.txt \
            "${skip[@]}" > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
