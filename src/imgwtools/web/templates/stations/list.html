{% extends "base.html" %}

{% block content %}
<header>
    <hgroup>
        <h1>Lista stacji</h1>
        <p>Przeglądaj stacje hydrologiczne i meteorologiczne IMGW</p>
    </hgroup>
</header>

<article>
    <div class="grid">
        <label>
            Typ stacji
            <select id="station-type" onchange="loadStations()">
                <option value="hydro">Stacje hydrologiczne</option>
                <option value="meteo">Stacje meteorologiczne</option>
                <option value="">Wszystkie stacje</option>
            </select>
        </label>

        <label>
            Szukaj
            <input type="search" id="station-search"
                   placeholder="Nazwa stacji, rzeka lub początek kodu (np. lodz)"
                   onkeyup="debounceSearch()">
        </label>

        <label>
            Limit wyników
            <select id="station-limit" onchange="loadStations()">
                <option value="25">25</option>
                <option value="50" selected>50</option>
                <option value="100">100</option>
                <option value="200">200</option>
            </select>
        </label>
    </div>
</article>

<section id="stations-results" hx-indicator="#loading-indicator">
    <!-- HTMX will load results here -->
    <div aria-busy="true">Ładowanie stacji...</div>
</section>

<script>
    let searchTimeout;

    function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadStations, 300);
    }

    function loadStations() {
        const params = new URLSearchParams({
            limit: document.getElementById('station-limit').value,
        });
        const kind = document.getElementById('station-type').value;
        const query = document.getElementById('station-search').value.trim();
        if (kind) {
            params.set('kind', kind);
        }
        if (query) {
            params.set('query', query);
        }

        htmx.ajax('GET', '/stations/find?' + params, {target: '#stations-results'});
    }

    // Load initial data
    document.addEventListener('DOMContentLoaded', loadStations);
</script>
{% endblock %}
