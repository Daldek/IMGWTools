services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: obserwator-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
      - api_keys:/app/keys
    environment:
      - OBSERWATOR_ENV=production
      - OBSERWATOR_HOST=0.0.0.0
      - OBSERWATOR_PORT=8000
      - OBSERWATOR_LOG_LEVEL=INFO
      - OBSERWATOR_API_KEYS_FILE=/app/keys/api_keys.json
      # MCP over Streamable HTTP at /mcp (read and plan only, English). Behind
      # nginx the Host is the public name: add it to
      # OBSERWATOR_MCP_ALLOWED_HOSTS (comma-separated, any port), e.g.
      # OBSERWATOR_MCP_ENABLED=true OBSERWATOR_MCP_ALLOWED_HOSTS=dane.example.pl docker compose up -d
      - OBSERWATOR_MCP_ENABLED=${OBSERWATOR_MCP_ENABLED:-false}
      - OBSERWATOR_MCP_ALLOWED_HOSTS=${OBSERWATOR_MCP_ALLOWED_HOSTS:-127.0.0.1,localhost}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: obserwator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  api_keys:
    driver: local
